<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solarcare</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;display:none;padding:20px;color:red;white-space:pre-wrap;overflow:auto;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML += '<strong>Error:</strong> ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error ? error.stack : '') + '\n\n';
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML += '<strong>Unhandled Promise Rejection:</strong> ' + event.reason + '\n\n';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
